version: '3.8'
services:
  # --- New Microservices ---
  bff_service:
    build: ./bff_service
    ports:
      - "3000:3000"
    restart: unless-stopped
    environment:
      - PORT=3000
      - ORCHESTRATOR_URL=http://orchestrator_service:8000
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - orchestrator_service
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M

  platform_ui:
    build: ./frontend_react
    ports:
      - "80:8080"
    restart: unless-stopped
    environment:
      - API_BASE_URL=http://localhost:8000 # Default fallback
      - ADMIN_TOKEN=${ADMIN_TOKEN:?ADMIN_TOKEN is required} # Protocol Omega Auth
      - VITE_FACEBOOK_APP_ID=${VITE_FACEBOOK_APP_ID}
      - VITE_FACEBOOK_API_VERSION=${VITE_FACEBOOK_API_VERSION:-v20.0}
      - VITE_META_CONFIG_ID=${VITE_META_CONFIG_ID}
    depends_on:
      - orchestrator_service
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 64M

  # --- Existing Backend Services ---

  orchestrator_service:
    build: ./orchestrator_service
    ports:
      - "8000:8000"
    restart: unless-stopped
    volumes:
      - ./orchestrator_service:/app
      - ./orchestrator_data:/app/data # PERSISTENT VECTOR STORAGE (v3.2)
    environment:
      - WHATSAPP_SERVICE_URL=http://whatsapp_service:8002
      - REDIS_URL=redis://redis:6379
      - POSTGRES_DSN=${POSTGRES_DSN}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
      - ADMIN_TOKEN=${ADMIN_TOKEN:?ADMIN_TOKEN is required} # Explicit Sync
      - META_SERVICE_URL=http://meta_service:8000
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - redis
      - postgres
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 512M

  agent_service:
    build: ./agent_service
    restart: unless-stopped
    # No ports exposed to host = Protocol Omega (Pressurized Tunnel)
    environment:
      - PORT=8001
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN} # Security Check
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8001/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.5'
        reservations:
          memory: 512M

  tiendanube_service:
    build: ./tiendanube_service
    restart: unless-stopped
    # No ports exposed to host = Protocol Omega (Store Integrations stay internal)
    environment:
      - PORT=8003
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
      - ADMIN_TOKEN=${ADMIN_TOKEN:?ADMIN_TOKEN is required}
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8003/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M

  whatsapp_service:
    build: ./whatsapp_service
    ports:
      - "8002:8002"
    restart: unless-stopped
    volumes:
      - ./whatsapp_service:/app
    environment:
      - YCLOUD_API_KEY=${YCLOUD_API_KEY}
      - YCLOUD_WEBHOOK_SECRET=${YCLOUD_WEBHOOK_SECRET}
      - META_VERIFY_TOKEN=${META_VERIFY_TOKEN}
      - ORCHESTRATOR_URL=http://orchestrator_service:8000
      - FRONTEND_URL=${FRONTEND_URL}
      - REDIS_URL=redis://redis:6379
      - OPENAI_API_KEY=${OPENAI_API_KEY} # For Audio Transcription
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8002/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - redis
      - orchestrator_service
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 256M

  meta_service:
    build: ./meta_service
    ports:
      - "8004:8000"
    restart: unless-stopped
    environment:
      - PORT=8000
      - ORCHESTRATOR_URL=http://orchestrator_service:8000
      - META_VERIFY_TOKEN=${META_VERIFY_TOKEN:?META_VERIFY_TOKEN is required}
      - META_APP_SECRET=${META_APP_SECRET}
      - INTERNAL_SECRET_KEY=${INTERNAL_API_TOKEN}
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - orchestrator_service
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M

  # --- Infrastructure ---

  redis:
    image: "redis:alpine"
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --tcp-backlog 511
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.25'
        reservations:
          memory: 128M

  postgres:
    image: "postgres:13"
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    shm_size: '512m'
    command: postgres -c shared_buffers=256MB -c effective_cache_size=512MB -c work_mem=16MB -c max_connections=100
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 256M

volumes:
  postgres_data:
