# Gzip compression (http context — included via conf.d inside nginx's http block)
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml text/xml;

# Rate limiting zone for auth endpoints
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

server {
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Docker DNS Resolver (Protocol Omega Network Resilience)
    resolver 127.0.0.11 valid=30s;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
    }

    # Static assets — long-term caching (Vite generates hashed filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Auth rate limiting
    location /api/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;

        set $upstream_app "http://orchestrator:8000";
        rewrite ^/api/(.*) /$1 break;

        proxy_pass $upstream_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Optional: Proxy /api requests if we wanted to avoid CORS,
    # but currently we are using full URLs in useApi.ts.
    # Proxy /api requests to the internal Orchestrator service
    # We use the internal Docker DNS name 'orchestrator' on port 8000.
    location /api/ {
        # Use variable to prevent boot-time resolution crash
        # Service name provided by user is 'orchestrator'
        set $upstream_app "http://orchestrator:8000";

        # Rewrite /api/foo -> /foo
        rewrite ^/api/(.*) /$1 break;

        proxy_pass $upstream_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # WebSocket proxy for Realtime Voice (explicit location for WS upgrade)
    location /api/public/onboarding/realtime-ws/ {
        set $upstream_app "http://orchestrator:8000";
        rewrite ^/api/(.*) /$1 break;

        proxy_pass $upstream_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 10s;
    }

    # WebSocket proxy for Voice Widget
    location /api/public/voice-widget/ws/ {
        set $upstream_app "http://orchestrator:8000";
        rewrite ^/api/(.*) /$1 break;

        proxy_pass $upstream_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # WebSocket proxy for Nova Widget
    location /api/public/nova/ws/ {
        set $upstream_app "http://orchestrator:8000";
        rewrite ^/api/(.*) /$1 break;

        proxy_pass $upstream_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Meta Service Proxy (Data Deletion Callback)
    # Proxies public frontend URL https://example.com/privacy/data-deletion -> http://meta_service:8000/privacy/data-deletion
    location /privacy/ {
        set $upstream_meta "http://meta_service:8000";
        proxy_pass $upstream_meta;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
